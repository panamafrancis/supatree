# Credentials for the supatree reviewer. UNTESTED — see docs/reviewer.md.
#
# Example only: fill in and apply, or (better) create the same two Secrets from
# your secret manager. Never commit real values.
apiVersion: v1
kind: Secret
metadata:
  name: supatree-reviewer
type: Opaque
stringData:
  # The bot account's token: fine-grained (Pull requests: read & write,
  # Contents: read, Metadata: read on the stack's repositories) or classic `repo`.
  GH_TOKEN: "github_pat_REPLACE_ME"
  # Claude credentials: one of the two.
  ANTHROPIC_API_KEY: "sk-ant-REPLACE_ME"
  # CLAUDE_CODE_OAUTH_TOKEN: "from `claude setup-token`"
---
apiVersion: v1
kind: Secret
metadata:
  name: supatree-reviewer-ssh
type: Opaque
stringData:
  # The private half of an SSH key added to the bot account, for cloning
  # git@github.com: URLs.
  id: |
    -----BEGIN OPENSSH PRIVATE KEY-----
    REPLACE_ME
    -----END OPENSSH PRIVATE KEY-----
